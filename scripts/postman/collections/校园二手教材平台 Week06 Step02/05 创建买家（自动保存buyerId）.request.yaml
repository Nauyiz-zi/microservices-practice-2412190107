$kind: http-request
url: "{{userUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentNo": "buyer-{{$timestamp}}",
      "displayName": "教材买家"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const body = pm.response.json();
        pm.collectionVariables.set("buyerId", String(body.id));
      }
    language: text/javascript
order: 5000
