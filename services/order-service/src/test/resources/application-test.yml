spring:
  datasource:
    url: jdbc:h2:mem:order_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    nacos:
      discovery:
        enabled: false
        password: test-only
    openfeign:
      client:
        config:
          user-service:
            url: http://localhost:8081
            connectTimeout: 500
            readTimeout: 1500

clients:
  user:
    base-url: http://localhost:8081
  textbook:
    base-url: http://localhost:8082
    discovery-enabled: false
  connect-timeout-ms: 500
  read-timeout-ms: 1500