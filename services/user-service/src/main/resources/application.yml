server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    default: dev
  application:
    name: user-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:CAMPUS_TEXTBOOK_CONFIG}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:user_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

auth:
  jwt:
    issuer: campus-textbook-auth
    audience: campus-api
    ttl-seconds: 900
    private-key: ${JWT_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    admin-username: ${AUTH_ADMIN_USERNAME:demo-admin}
    admin-password-hash: ${AUTH_ADMIN_PASSWORD_HASH:}
    user-username: ${AUTH_USER_USERNAME:demo-user}
    user-password-hash: ${AUTH_USER_PASSWORD_HASH:}
