name: campus-textbook-week05

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - campus_net

    healthcheck:
      test: 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --silent --skip-column-names --execute="SELECT 1" > /dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    image: campus-textbook:week05

    build:
      context: ./monolith
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_SQL_INIT_MODE: never
      TZ: Asia/Shanghai

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    networks:
      - campus_net

volumes:
  mysql_data:

networks:
  campus_net:
    driver: bridge